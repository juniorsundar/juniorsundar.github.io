# Manually build the CV with phone/address (which never live in the repo) and download it as an artifact.
# Accepted risk (owner's choice): in this public repo the artifact is downloadable by any signed-in GitHub
# user until it expires, so it is kept for 1 day. Delete it from the run page once downloaded.
name: Full CV (private details)
on:
  workflow_dispatch:
    inputs:
      phone:
        description: Phone number to print on the CV
        required: false
        default: ""
      address:
        description: Postal address to print on the CV
        required: false
        default: ""
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Inputs are read from the event payload, never via `env:`: GitHub prints a step's env block in the log
      # before running it, which would leak them. They're masked here, then passed on through $GITHUB_ENV.
      # A newline would split the mask (leaking the rest) and could inject workflow commands, so it's refused first.
      - name: Mask inputs in logs
        run: |
          phone=$(jq -r '.inputs.phone // ""' "$GITHUB_EVENT_PATH")
          address=$(jq -r '.inputs.address // ""' "$GITHUB_EVENT_PATH")
          case "$phone$address" in *$'\n'*|*$'\r'*) echo "phone/address must be a single line" >&2; exit 1;; esac
          if [ -n "$phone" ]; then echo "::add-mask::$phone"; fi
          if [ -n "$address" ]; then echo "::add-mask::$address"; fi
          { echo "CV_PHONE=$phone"; echo "CV_ADDRESS=$address"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build CV
        run: nix develop --command cv/build.sh cv-full.pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cv-full
          path: cv-full.pdf
          retention-days: 1
